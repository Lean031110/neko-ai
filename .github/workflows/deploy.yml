name: Deploy Info

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  report:
    name: Report status
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Status
        run: |
          echo "✅ CI passed for ${{ github.event.workflow_run.head_branch }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
